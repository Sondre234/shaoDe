# hyprlang fixture: variables, source, sections, monitors, and every window rule syntax.
$accent = rgba(ff8800ee)
source = ~/.config/hypr/look.conf # ~/.config/ lands in this copy

monitor = DP-1, 2560x1440@143.97, 1920x0, 1.5, transform, 1, vrr, 1
monitor = HDMI-A-1, 1920x1080, 0x0, 1
monitor = DP-2, disable
monitor = , preferred, auto, 1
monitor = DP-9, 1920x1080@60, -1920x0, 1ab

input {
    kb_layout = us
    kb_options = caps:escape
    repeat_rate = 30
    sensitivity = -0.25
    accel_profile = flat
    touchpad {
        natural_scroll = yes
        tap-to-click = true
    }
}
device {
    name = some-mouse
    sensitivity = 1
}

windowrule = opacity 0.80 0.70,class:^(kitty)$
windowrulev2 = opacity 0.9 override, class:firefox
windowrule = match:class ^(foot)$, opacity 0.85
windowrule = opacity 0.9,title:^(x)$
windowrule = float, class:^(pavucontrol)$
windowrule {
    name = zen
    match:class = zen
    opacity = 0.95 0.9
}
bind = SUPER, Q, exec, kitty
exec-once = waybar
source = /etc/hostname
