# xdg-desktop-portal backends for XDG_CURRENT_DESKTOP=shaoDe.
# Screen sharing and screenshots need xdg-desktop-portal-wlr (plus PipeWire);
# file choosers and the rest come from xdg-desktop-portal-gtk.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
